<div class="container">
  <div class="mat-elevation-z10 mt-4 mx-auto col-12 rounded-3">
    <div class="col-10 text-center mb-4">
      <h5>Reactive Form</h5>
    </div>
    <div class="col-6 mx-auto">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="col-6">
          <!-- username -->
          <mat-form-field appearance="outline">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username"/>
            <mat-error *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.invalid">
              Username Required
            </mat-error>
          </mat-form-field>
        </div>
        <div class="col-6">
          <!-- Email -->
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email"/>
          </mat-form-field>
          <mat-error *ngIf="registerForm.get('email')?.errors?.['required']">
            Email is Required
          </mat-error>

          <mat-error *ngIf="registerForm.get('email')?.errors?.['email']">
            Invalid Email format
          </mat-error>
        </div>
        <div class="col-12">
          <!-- Gender -->
          <mat-label>Gender</mat-label>
          <mat-radio-group formControlName="gender">
            <mat-radio-button value="male">Male</mat-radio-button>
            <mat-radio-button value="female">Female</mat-radio-button>
          </mat-radio-group>
        </div>

        <div class="col-6">
          <!-- Country -->
          <mat-form-field appearance="outline">
            <mat-label>Select</mat-label>
            <mat-select formControlName="country">
              <mat-option value="INDIA">INDIA</mat-option>
              <mat-option value="USA">USA</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div formGroupName="address">
          <div class="col-6">
            <mat-form-field appearance="outline">
              <mat-label>Address 1</mat-label>
              <input matInput formControlName="address1">
            </mat-form-field>
          </div>
          <div class="col-6">
            <mat-form-field appearance="outline">
              <mat-label>Address 2</mat-label>
              <input matInput formControlName="address2">
            </mat-form-field>
          </div>
          <div class="col-6">
            <mat-form-field appearance="outline">
              <mat-label>City</mat-label>
              <input matInput formControlName="city">
            </mat-form-field>
          </div>
           <div class="col-6">
            <mat-form-field appearance="outline">
              <mat-label>Pincode</mat-label>
              <input matInput formControlName="pincode">
            </mat-form-field>
          </div>
        </div>

        <label>Skills:</label>
        <div *ngFor="let control of registerForm.controls.skills['controls'] ; let i = index">
          <div class="row col-10" formArrayName="skills">
            <div class="">
              <mat-form-field appearance="outline">
              <mat-label>Skill {{i+1}}</mat-label>
              <input matInput [formControlName]="i">
            </mat-form-field>
            <button mat-button color="warn" (click)="deleteSkill(i)">Delete</button>
            </div>

          </div>
        </div>
        <div class="col-6">
          <button mat-stroked-button color="primary" (click)="addSkill()">Add Skill</button>
        </div>
        <div class="col-12">
          <!-- Checkbox-->
          <mat-checkbox formControlName="agree">I agree to terms & conditions</mat-checkbox>
        </div>
        <div class="col-6 text-center p-4">
          <button mat-stroked-button color="primary" type="submit" [disabled]="registerForm.invalid">
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
